# Installed by Ohman as /etc/modules-load.d/ohman-wmi.conf: kernel modules loaded at every boot.
#
# ohman-wmi  the passthrough to HP's BIOS mailbox (/dev/ohman-wmi). Built by DKMS from /usr/src/ohman-wmi-*.
#            On a machine without that mailbox it refuses to load, which is harmless.
# msr        the kernel's own CPU register driver (/dev/cpu/*/msr), for die temperature and power limits.
#            Most distributions build it as a module and do not load it by default.
#
# The stock hp-wmi driver is left alone: it stays loaded and the two work side by side.
ohman-wmi
msr
