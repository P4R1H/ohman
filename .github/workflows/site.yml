# The website lives in docs/ next to the code it describes, which is the only reason it has stayed accurate.
# GitHub Pages serves it from a second repository, ohmanapp/ohmanapp.github.io, so this copies it across on
# every push. Treat that repository as a build output: anything committed there by hand is overwritten.
#
# Needs a secret named SITE_TOKEN on this repository: a fine-grained personal access token, resource owner
# ohmanapp, scoped to the single repository ohmanapp/ohmanapp.github.io, with Contents: Read and write.
# Settings -> Secrets and variables -> Actions -> New repository secret.
name: Publish site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Check out the site repository
        uses: actions/checkout@v4
        with:
          repository: ohmanapp/ohmanapp.github.io
          token: ${{ secrets.SITE_TOKEN }}
          path: site

      - name: Copy the site across
        run: |
          set -euo pipefail
          # Everything except .git, so a page deleted here is deleted there too.
          find site -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          # docs/ also holds laptops.md and research.md, which are documentation for the repository and are
          # linked from the site on github.com. Only what the page itself loads is published.
          cp docs/index.html site/
          cp docs/*.png docs/*.webp site/
          touch site/.nojekyll

      - name: Commit and push
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name 'ohman site'
          git config user.email 'P4R1H@users.noreply.github.com'
          git add -A
          if git diff --staged --quiet; then
            echo 'Site is already up to date.'
            exit 0
          fi
          git commit -m "Site from ${GITHUB_REPOSITORY}@${GITHUB_SHA:0:7}"
          git push
